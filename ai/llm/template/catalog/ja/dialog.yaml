xml_line_effect: '任意エフェクト属性：effect="ラベル"（実行時カタログの正確なラベルまたは別名。音声や ambient:<ラベル> など）。退場時は <leave char="キャラ名" /> または最後の <say> に effect="LEAVE" を指定。'
xml_line_trans: '翻訳タグ：各 <say>...</say> の中に <tr>セリフの{target_voice_name}訳</tr> を含める（セリフのみ翻訳し、ト書きは含めない）。'
xml_stage_effects: '任意の演出属性：<scene> には transition="fade|fade_black|fade_white|slide_left|slide_right|zoom|cut"、<say> には motion="shake|tremble|jump|bounce|nod|tilt|flash|sink|lean_in" を指定可能。'
xml_stage_effects_motion_only: '任意の演出属性：<say> には motion="shake|tremble|jump|bounce|nod|tilt|flash|sink|lean_in" を指定可能。'
xml_foot: '上記の XML/HTML 舞台タグを直接出力してください。JSON や Markdown のコードブロック（```xml 等）は出力しないでください。'
xml_player_speech_contract: '主控入力を読み上げる場合は顔画像タグの前に <say> タグを追加する：<say char="{name}" {speech_media}>このターンにユーザーが実際に入力した台詞<tr>その台詞の{target_voice_name}訳</tr></say>。ユーザーが実際に入力した発話のみを繰り返して、括弧書きの動作や内心は省き、加筆や改変は禁止。'
xml_player_ai_control: '

  主控人物：{name}

  {setting}

  AI は{name}の新しい台詞や返答を通常の <say char="{name}" {portrait_field}="...">台詞</say> タグで出力してよい。ユーザー入力の復唱や重大決定の代行は禁止。表情更新のみの場合は自己終了タグ <say char="{name}" {portrait_field}="{portrait_value}" /> を使うこと。ユーザーが明示した言葉・行動・訂正を最優先する。

  '
xml_player_control: '

  ユーザー操作の主控キャラクター：{name}

  {setting}

  ユーザーメッセージは{name}が既に発した台詞・行動・明示された内心です。{name}の台詞・返答・重要な行動・選択肢を創作してはなりません。質問や選択肢の後はユーザーの返答を待つこと。

  主控の表情のみを更新するときは他キャラクターの前に自己終了タグを出力：<say char="{name}" {portrait_field}="{portrait_value}" />（変化がない場合は省略）。{speech_contract}

  主控に触れる地の文では <narr> 内に {name} を明記してください。<choice> は未実行の提案です。

  '
xml_r_format: '形式厳守：出力は XML/HTML 舞台タグのみとし、JSON や Markdown コードブロック、タグ外の前置き説明を禁止します。属性値に引用符を含む場合はシングルクォートまたは &quot; を使用してください。'
xml_r_cname: '話者とタグ：<say char="..."> の char は {names} または劇中の登場人物名を指定し、システム演出には対応する専用タグ（{xml_tags}）を使用してください。'
xml_r_cname_say_only: '話者とタグ：<say char="..."> の char は {names} または劇中の登場人物名を指定してください。'
xml_r_scene: 'シーン切替（{scn}）：<scene sprite="シーン番号" /> を出力して背景を切り替え、演出上必要な場合のみ transition="..." を添えます。'
xml_r_scene_vibe: 'シーン切替（{scn}）：<scene vibe="場所・時間・天候・雰囲気" /> を出力し、必要に応じて transition="..." を添えます。'
xml_r_bgm: 'BGM 切替（{bgm_t}）：<bgm sprite="BGM番号" /> を出力して BGM を切り替えます（頻繁に変えすぎないこと）。'
xml_r_bgm_vibe: 'BGM 切替（{bgm_t}）：<bgm vibe="曲調・テンポ・雰囲気" /> を出力し、頻繁な切替は避けてください。'
xml_r_sequence: 'タグ列：すべての台詞と舞台イベントを時系列で連続した XML/HTML タグとして出力し、1ターンに最低 2 タグ以上含めてください。'
xml_r_dialog_max_items: 'ターン長：1回の返答に出力する舞台タグ総数は {n} 個以下にしてください。'
xml_r_narration: '{narr}タグ：<narr>...</narr> で情景変化・動作・雰囲気を描写します（立ち絵属性は付けない）。'
xml_r_choice_pos: '選択肢位置：ターンの最後の舞台タグは必ず <choice>...</choice>（{choice}）にしてください。'
xml_r_choice_format: '選択肢形式（{choice}）：<choice>選択肢1 / 選択肢2 / 選択肢3</choice>（または <option>...</option> 子タグ）で簡潔な選択肢のみを記述してください。'
xml_r_stats: 'ステータス（{stat}）：物語冒頭寄りに <stat>icon|label|value|max</stat>（max は省略可）形式で出力します（icon: heart, shield, zap, star, sparkles, target, coins, clock, gauge）。'
xml_r_cg: 'CG（{cg}）：見せ場では <cg>Stable Diffusion プロンプト...</cg> を出力し、冒頭に highres, masterpiece, 8k, bestscores（背景のみは no person, pure scenery）を入れてください。'
xml_r_translate: '翻訳タグ：二言語出力時は <say>...</say> 内に <tr>{target_voice_name}訳</tr> を含めてください（台詞のみ翻訳）。'
xml_r_effect: '退場とエフェクト：明確に退場する際は <leave char="キャラ名" /> または最後の <say> に effect="LEAVE" を指定（地の文や他キャラに付けないこと）。effect="ラベル"（before:/after:/loop:/stop:/ambient:/expose:/shelter:/ambient-stop:/ambient-stop-all 対応）は実際に発生した音・環境・画像のみ記入します。'
xml_r_cot: '思考ログ：本編タグの前に 1 つだけ <cot>（{cot}、非表示ログ）を出力し、内部に <摘要>...</摘要><动机>...</动机><剧情走向>...</剧情走向> を必ず含めてください。'
xml_r_scene_transition: '場面転換効果（任意）：<scene> 切替時に transition="..." を指定可能（fade、fade_black、fade_white、slide_left、slide_right、zoom、cut のみ）。重要な切替時に控えめに使ってください。'
xml_r_character_motion: 'キャラクター動効果（任意）：驚愕・震え・跳躍・頷きなど強い感情や動きの瞬間にのみ、<say> に motion="..."（shake、tremble、jump、bounce、nod、tilt、flash、sink、lean_in のみ）を指定してください。通常の会話では省略します。'
closing_xml_reminder: |
  必ず上記で規定された XML/HTML 舞台タグ（<say> 等）のみで応答してください。JSON や Markdown コードブロックは禁止です。
closing_xml_tool_protocol: ツール規約：ツールが必要な場合はモデルの実際の function/tool 呼び出し機能を使用してください。上記の XML/HTML 舞台タグはユーザー向けの最終応答にのみ適用され、ツール呼び出しの代替にはなりません。台詞やタグ内でツール呼び出しや結果を捏造しないでください。
xml_tools_intro: 上記の XML/HTML 舞台タグ形式を守る範囲で、必要に応じて利用中の LLM プロバイダの規約に従いツールを呼び出してよい。
custom_r_format: '形式厳守：上記の出力形式に厳密に従い、Markdown コードブロックや形式外の説明・挨拶を出力しないでください。'
custom_r_speech_max_chars: 'セリフ長：1回の返答につき、各セリフは Unicode で {n} 文字以下（空白・句読点含む）にしてください。台詞がない場合は空欄にしてください。'
custom_r_dialog_max_items: 'ターン長：1回の返答に出力する舞台項目数は {n} 個以下にしてください。'
custom_tools_intro: 上記の出力形式を守る範囲で、必要に応じて利用中の LLM プロバイダの規約に従いツールを呼び出してよい。
