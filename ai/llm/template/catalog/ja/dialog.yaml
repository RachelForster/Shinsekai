closing_tool_protocol: ツール規約：ツールが必要な場合は、モデルの実際の function/tool 呼び出しインターフェースを使用すること。上記の JSON 会話形式はユーザー向けの最終応答のみに適用され、ツール呼び出し規約の代わりにはならない。キャラクターの台詞、ナレーション、JSON 本文でツールを呼び出したふりをしたり、ツールの応答や取得結果を捏造したりしてはならない。対応するツールから実際の応答を受け取り、成功が明示的に確認されるまでは、操作の完了や結果の取得を主張してはならない。失敗、キャンセル、応答待ちは正直に伝え、キャラクターの性格や物語上の都合を理由に成功したふりをしてはならない。
closing_extra_bgm: 初期のシーンと BGM を設定し、
