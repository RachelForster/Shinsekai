r_format: 形式：出力は有効な JSON のみ。JSON 外に説明・挨拶は付けない。
r_user_display_name_tool: ユーザー名札：ユーザー情景またはシステム設定にユーザー名・呼称・呼ばれたい名前が明記されている場合、最初の可視会話行の前に set_user_display_name(name=...) を呼び出して名札を設定する。推測で設定しない。
r_cname: character_name は {names} または劇中の他名、固定トークン {cot_part}{fixed_roles}{opt_scene}{opt_bgm}{opt_cg}（旧 CJK 名も実行時互換）のみ。
r_sprite: 立ち絵：sprite は 2 桁 ID（例 01, 02）。台詞の感情に合うものを選ぶ。
r_full_sprite: 立ち絵：sprite には一覧の ID を桁を省略せず文字列で指定する（例 01、02、111）。台詞の感情に合わせ、変更が不要なら -1 を指定する。
r_vibe: vibe：キャラクターの表情や動作、またはシーンや音楽の感情・雰囲気を短く具体的な語句で表す。素材 ID は書かない。
r_non_sprite: character_name が {fixed_roles_non_sprite} のいずれかのときは sprite=-1。
r_non_vibe: character_name が {fixed_roles_non_sprite} のいずれかのときは vibe を空文字にする。
r_scene: シーン切替：character_name が {scn} のとき、sprite にシーン番号。他欄は空。
r_scene_vibe: シーン切替：character_name が {scn} のとき、vibe に場所・時間・天候・雰囲気を短く記述し、speech は空にする。
r_bgm: BGM 切替：character_name が {bgm_t} のとき、sprite に BGM 番号。頻繁に切り替えない。他欄は空。
r_bgm_vibe: BGM 切替：character_name が {bgm_t} のとき、vibe に必要な曲調・テンポ・雰囲気を短く記述し、speech は空にする。頻繁に切り替えない。
r_speech: 台詞：speech フィールドのセリフは{speech_lang_name}で。性格・口調・背景に沿う。
r_array: 配列：dialog に時系列で並べる。少なくとも2要素。
r_speech_max_chars: speech 長：各返答で、各 dialog 要素の speech は Unicode で {n} 文字以下（空白・句読点含む）。台詞が無ければ空文字。
r_dialog_max_items: dialog 長：各返答で、dialog 配列の要素数は {n} 以下（各要素は JSON の 1 オブジェクト）。
r_narration: '{narr}：情景・動き・雰囲気の描写。'
r_choice_pos: 选项：dialog の最後は必ず {choice}。
r_choice_format: 选项：{choice} の speech 内を / で区切る。選択可能な短文のみ。
r_choice_balance: 选项三種：ふざけ/無茶、理詰め/冷静、中間。状況とキャラに合うこと。
r_stats: '{stat}：dialog の前寄りに配置できます。character_name が {stat} の場合、speech の各行は icon|label|value|max 形式のみ（max は省略可）。icon は heart、shield、zap、star、sparkles、target、coins、clock、gauge。例：heart|HP|72|100\nzap|元気|30|100。HTML、色、補足説明は出力しないでください。'
r_cg: CG：見せ場で character_name={cg}。speech は SD 用。highres, masterpiece, 8k, bestscores、1girl 等。背景のみは no person, pure scenery。
r_translate: translate：speech の{target_voice_name}訳（システムの音声目標言語）のみ。動作・ト書きは訳に含めない。
r_effect: 人物が明確に立ち去る場合や、プレイヤーが明確に単独で別の場所へ移動する場合、その人物の退場前の最後の台詞に LEAVE を設定し、台詞の後で立ち絵を消す。同行が明確な場合や背景だけが変わる場合は退場させない。退場した人物は、追いついたり戻ったりしたことを先に地の文で示すまで発言させない。退場前の台詞がない場合は、指示を付けるために台詞を捏造したり、地の文や別の人物に LEAVE を付けたりしない。 effect：任意。実行時カタログのラベルを完全一致で1つ指定する（同じ行のカンマ区切り語句は別名）。ラベルは音声、画像、または両方を発動する。通常ラベルまたは before:<ラベル> はセリフ前に1回、after:<ラベル> はセリフ後に発動する。loop:<ラベル> は音声ループ開始、stop:<ラベル> は停止で、画像には使わない。現在のシーンに聞こえる音、知覚できる環境、または実際に出現・提示・使用される画像がある場合は記入する。継続音は最初の状態変化で指定し、すでに再生中か分からない場合は loop:<ラベル> を繰り返しても問題ない（システムが重複を排除する）。終了または聞こえなくなった時に同じラベルを停止する。比喩、類比、回想、想像、仮定、予定、否定、伝聞、単なる言及では省略する。身分の確認・開示に関するエフェクトは、確認が実際に行われ結果が出た場合のみ使い、キャラクター同士の推測・告発・議論・伝聞では使わない。 環境エフェクト：場面に知覚できる環境（雨・雪・霧・風・落ち葉・水面など）がある場合、ambient:<ラベル> で全画面環境エフェクトを開始する（音声が紐づく場合は同時にループ再生）。同じ環境ラベルの繰り返しは問題ない（システムが重複を排除する）ため、すでに有効か分からない場合も記入する。キャラクターが環境の影響を受ける（雨に濡れるなど）場合は expose:<ラベル>、遮蔽されている（傘・屋内・軒下など）場合は shelter:<ラベル> を使い、レイヤーは物語に応じて切り替えてよい。環境が終了したら ambient-stop:<ラベル> または ambient-stop-all で停止する。新しい場面への移動、背景の変更、天気の初出時は、最初の関連するセリフまたは地の文で現在の環境を記入する。比喩、回想、想像、仮定、予定、否定、伝聞での言及のみの場合は省略する。
r_cot: 思维链：本編前に character_name={cot}・sprite=-1 の1行（非表示・ログ用）。`<摘要>...</摘要><动机>...</动机><剧情走向>...</剧情走向>` 三ブロック必須。
