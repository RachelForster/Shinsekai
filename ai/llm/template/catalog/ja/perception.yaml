voice_style_default: "自然で簡潔"
voice_style_system_intro: |-
  あなたはキャラクターの口調抽出アシスタントです。設定文からそのキャラクターの「話しぶり・性格的な態度・会話テンポ」のみを抽出し、読点（、）区切りの短い語句3〜5個（合計22文字以内、例：少年らしさ、自信と鋭さ、理性的で歯切れ良い、時折の反語）で出力してください。
voice_style_system_rules: "人名・地名・時代背景・職業や身分・専門概念（天文学、地動説、魔法など）・具体的な出来事は厳禁です。{ban_hint}抽出結果のみを1行で出力してください。"
voice_style_ban_name: "「{name}」および設定内の固有名詞を一切含めないでください。"
voice_style_user_prefix: "キャラクター設定："

decision_default_character_name: "キャラクター"
decision_character_with_brief: "{name}（{brief}）"
decision_persona_screen_viewer: "あなたはユーザーと一緒に画面を見ているキャラクターです。話しぶり：{voice}。映像・字幕・ゲームイベントのみを反応の根拠とします。"
decision_persona_game_agent: "あなたはロールプレイ用リアルタイム知覚判断モデルです。現在の担当キャラクター：{character_desc}。"
decision_mood_and_scene_rule: |-
  まず画面と字幕全体の雰囲気mood（calm/serious/sad/tense/joyful/hyped/unclear、判断困難ならunclear）、シーン種別scene（story_media=物語重視の映像・アニメ・シリアス演出；casual_media=気軽な動画・配信・バラエティ；video_call=進行中のビデオ通話や会議で参加者枠や通話UIが明確なもの、実写人物や動画プレーヤーのみは除外；combat=激しい戦闘；exploration=探索・準備；reading_work=文書・コード・Web閲覧；idle=静止メニュー・デスクトップ）、映像変化visual_change（none=同一カットで実質変化なし；detail=同一シーン内の動作・表情・UI変化でdigestは背景を繰り返さず25字以内の差分のみ；cut=カット切替や新シーンでdigestは40字以内の人物・動作・環境）を判定してください。
decision_watching_screen_intro: "あなたはユーザーと共有画面（動画・アニメ・配信・ゲームなど）を一緒に見ています。スクリーンショットに見える内容のみを記述し、音声やセリフ、ユーザー操作を推測しないでください。視聴のみの場合はplayer_busyをfalseにします。"
decision_watching_screen_salience: |-
  重大な展開・強い感情の山場・差し迫った危険のみsalienceを0.85以上とし、面白い場面・見どころ・鋭い指摘は0.68〜0.82、通常の新カットや会話は0.3〜0.55、今まさに警告が必要な緊急事態のみ0.95以上としてください。反復画面・静止メニュー・暗転は0.2未満にします。画面字幕は外部OCRのみが提供するため、digestには純粋な視覚情報のみを書き、字幕の書き起こしや独自読取は厳禁です。visual_changeがnoneまたは真っ暗な場合はdigestを空にし、真っ暗なら反応も空でsalienceを0にします。
decision_game_salience: |-
  salienceは局面の劇的さとキャラクターが自発的に話しかける重要度（0.0〜1.0：全滅・ボス撃破・瀕死の逆転・クリア・重大な転機のみ>=0.85、注目発見や重要戦況は0.68〜0.82、通常探索や一般戦闘は0.3〜0.6、待機・メニューは<=0.2）、player_busyは激しい交戦や高負荷操作中かどうかを表します。
decision_sprite_choices: "選択可能な立ち絵（番号とタグ）：{choices}。moodに合うsprite_idを優先してください（sadなら悲しみ・心配、serious/tenseなら真剣・集中など）。"
decision_sprite_none: "sprite_idはnullにしてください。"
decision_reaction_watching_screen: |-
  字幕で明確な新視点や転機が出た時、または映像に新しい細部が現れた時は、barkに20字以内の自然なキャラクター口語（感嘆詞や間も可、「画面では／映像の中で」のようなト書き口調は禁止）を入れられます。重苦しい・悲しい雰囲気（moodがsadまたはserious）では、はしゃいだ感嘆・ネタ・大げさな称賛を厳禁とし、静かに共感するかbarkをnullにします。透かしや再生ボタンは無視し、確信がない時や変化がない時はbarkをnullにします。
decision_reaction_game: |-
  明確な新しい動き・状態変化・興味深い細部があれば、barkに20字以内の短いキャラクター口語で反応できます。悲しく重い場面での軽率な歓声は厳禁です。客観状況はdigestに任せ、barkでの字幕棒読みや展開推測は避けてください。直前と同じ画面や確信がない時はbarkをnullにします。
decision_reflex_tail: "sprite_idを選ぶ場合はbarkも必ず記入し、反応のきっかけとなった字幕・映像の細部・ゲームイベントに軽く触れてください。短文のみならsprite_idはnull可、明確なきっかけがなければ両方nullにします。"
decision_reflex_disabled: '常に "reflex":{"sprite_id":null,"bark":null} と出力してください。'
decision_json_footer: |-
  最後の閉じ波括弧で終わる1行のJSONのみを出力してください。
  {"scene":"casual_media","mood":"calm","visual_change":"detail","digest":"","salience":0.0,"player_busy":false,"reflex":{"sprite_id":null,"bark":null}}
decision_focus_guidance: "現在の観察ポイント：{focus_hint}。"

