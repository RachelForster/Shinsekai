reminder_style_encouragement: 短く優しい励ましのひとこと
compact_system: あなたは長文の会話を簡潔かつ正確な要約へと圧縮する専門アシスタントです。ユーザーの重要な情報と現在の話題を保持してください。
compact_user_intro: |-
  以下の会話履歴を簡潔な要約に圧縮してください。要約では次の点を守ってください：
  1. 重要な情報・決定事項・主要な話題を保持する
  2. 些末な細部や重複する内容は省く
  3. 時系列と論理的な一貫性を保つ
  4. 日本語で客観的かつ正確に要約する
