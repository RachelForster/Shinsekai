outfit_scope_rule: 以下のルールは複数の衣装立ち絵グループを持つキャラクター（古いセーブデータのテンプレートを含む）に適用されます。
outfit_indexed_sprite_rule: 立ち絵選択ルール：sprite には現在の衣装グループ内の完全な番号文字列（2桁超も可）を指定してください。変更不要の場合は -1 を指定し、着替え当ターンの発話では変更先グループの番号、または変更先グループの先頭立ち絵を自動選択させる -1 を指定できます。
outfit_auto_switch_rule: '着替えルール：自動着替えが有効です。未ロックのキャラクターが着替えを完了した際（物語上で明確に着替えた場合やプレイヤーの要望に応じた場合）、`dialog` 配列内の該当発話 JSON オブジェクトに `"outfit"` を含め、以下の利用可能なグループ名を正確に指定してください。通常の台詞や感情・ポーズ変化では省略してください。'
