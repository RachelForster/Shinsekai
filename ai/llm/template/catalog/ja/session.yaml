dialog_repair_initial: 直前の応答をアプリケーションの対話 JSON 形式に整形し直してください。空でない `dialog` 配列を持つ JSON オブジェクトのみを返してください。各キャラクター・シーン・BGM 項目には `character_name`、`speech`、`{media_field}` が必須です。COT、NARR、CHOICE、STAT、CG などの固定システム項目ではメディアフィールドを省略できます。ツールの呼び出しや Markdown の付加は行わないでください。
dialog_repair_retry: その応答はまだ有効な形式ではありません。アプリケーションの対話 JSON のみで回答しなければなりません。空でない `dialog` 配列を持つ JSON オブジェクトのみを返してください。各キャラクター・シーン・BGM 項目には `character_name`、`speech`、`{media_field}` が必須です。COT、NARR、CHOICE、STAT、CG などの固定システム項目ではメディアフィールドを省略できます。ツールの呼び出しや Markdown の付加は行わないでください。
memory_context_simple_guidance: このターンに関連する長期記憶です。背景情報としてのみ参照し、ユーザーから尋ねられない限り検索プロセスには触れないでください。
memory_context_tiered_guidance: このターンに関連する長期記憶です。各項目の鮮明度タグ（[固有設定]、[鮮明]、[やや古い・朧気な印象]、[呼び覚まされた遠い記憶]）に従い背景として自然に活用し、尋ねられない限り記憶検索システムには決して言及しないでください。
