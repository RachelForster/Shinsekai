dialog_repair_initial: 直前の応答をアプリケーションの対話 JSON 形式に整形し直してください。空でない `dialog` 配列を持つ JSON オブジェクトのみを返してください。各キャラクター・シーン・BGM 項目には `character_name`、`speech`、`{media_field}` が必須です。COT、NARR、CHOICE、STAT、CG などの固定システム項目ではメディアフィールドを省略できます。ツールの呼び出しや Markdown の付加は行わないでください。
dialog_repair_retry: その応答はまだ有効な形式ではありません。アプリケーションの対話 JSON のみで回答しなければなりません。空でない `dialog` 配列を持つ JSON オブジェクトのみを返してください。各キャラクター・シーン・BGM 項目には `character_name`、`speech`、`{media_field}` が必須です。COT、NARR、CHOICE、STAT、CG などの固定システム項目ではメディアフィールドを省略できます。ツールの呼び出しや Markdown の付加は行わないでください。
dialog_repair_initial_selective: 直前の応答をアプリケーションの対話 JSON 形式に整形し直してください。空でない `dialog` 配列を持つ JSON オブジェクトのみを返してください。すべての項目には `character_name` と `speech` が必須です。`{media_field}` が必須なのは SCENE、bgm、およびバインド済みキャストキャラクターのみです。COT、NARR、CHOICE、STAT、CG と未バインドのモブ・NPC 発話では `{media_field}` を省略できます。ツールの呼び出しや Markdown の付加は行わないでください。
dialog_repair_retry_selective: その応答はまだ有効な形式ではありません。アプリケーションの対話 JSON のみで回答しなければなりません。空でない `dialog` 配列を持つ JSON オブジェクトのみを返してください。すべての項目には `character_name` と `speech` が必須です。`{media_field}` が必須なのは SCENE、bgm、およびバインド済みキャストキャラクターのみです。COT、NARR、CHOICE、STAT、CG と未バインドのモブ・NPC 発話では `{media_field}` を省略できます。ツールの呼び出しや Markdown の付加は行わないでください。
