outfit_auto_switch_rule_xml: '着替えルール：自動着替えが有効です。未ロックのキャラクターが着替えを完了した際（物語上で明確に着替えた場合やプレイヤーの要望に応じた場合）、該当発話の `<say>` タグに `outfit="利用可能なグループ名"` 属性を含めてください。通常の台詞や感情・ポーズ変化では省略してください。'
