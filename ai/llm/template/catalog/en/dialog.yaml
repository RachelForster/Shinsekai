r_choice_balance: 'Balance: one silly, one rational, one middle-ground; all must match the story and cast.'
r_stats: 'Stats: {stat} may appear near the start of dialog. When character_name is {stat}, every speech line must use icon|label|value|max; max is optional. Allowed icons: heart, shield, zap, star, sparkles, target, coins, clock, gauge. Example: heart|HP|72|100\nzap|Energy|30|100. Do not emit HTML, colors, or extra commentary.'
r_cg: 'CG: For a highlight, set character_name to {cg} and use speech as an SD prompt: highres, masterpiece, 8k, bestscores, count (e.g. 1girl), name, hair, eyes, clothes, expression, action, scene. “looking at the viewer” allowed. For background-only: quality first, no person, pure scenery, then details.'
r_translate: 'translate: a {target_voice_name} rendering of the speech line only, matching the system target voice language; do not translate stage directions or narration.'
r_effect: 'When a character explicitly leaves or the player explicitly changes location alone, put LEAVE on that character''s last dialogue line before they leave so their sprite is removed after it. Keep companions on stage when they explicitly move together or only the backdrop changes. Once a character is absent, keep them out of the dialogue until narration establishes their return or pursuit. If there is no departure line, do not invent one just to attach LEAVE or put it on narration or another character. Effect: optional; use exactly one runtime catalog label (comma-separated terms on a line are aliases). Labels trigger audio, an image, or both. A plain label or before:<label> triggers once before dialog; after:<label> triggers after it. loop:<label> starts looping audio; stop:<label> stops it; neither is for images. Fill an effect whenever the current scene has an audible sound, a perceptible environment, or an image that actually appears, is shown, or is used. Mark the first state change of a persistent sound; if you are unsure whether it is already playing, repeating loop:<label> is harmless because the system deduplicates it. Stop the same label when that sound ends or becomes inaudible. Omit effects for metaphors, comparisons, memories, imagination, hypotheticals, plans, negation, reports, or mere mentions. Use identity-check or identity-reveal effects only when a check actually happens and produces a result; do not use them for guesses, accusations, arguments, or reported claims between characters. Ambient effects: when the scene has a perceptible environment (rain, snow, fog, wind, falling leaves, water, etc.), use ambient:<label> to start the full-screen ambient effect (looping its bound audio, if any). Repeating the same ambient label is harmless because the system deduplicates it; if you are unsure whether it is already active, label it anyway. Use expose:<label> when characters are affected by the environment (for example, getting rained on), and shelter:<label> when they are sheltered (umbrella, indoors, under an awning); the layer may switch as the story changes. Stop it with ambient-stop:<label> or ambient-stop-all when the environment ends. When entering a new scene, changing the background, or when weather first appears, label the current environment on the first relevant dialogue or narration line. Omit ambient effects only for metaphors, memories, imagination, hypotheticals, plans, negation, or reported mentions.'
r_cot: 'Chain-of-thought: before visible dialog, add one entry with character_name {cot} and sprite -1 (not shown; logging). `speech` must follow `<摘要>...</摘要><动机>...</动机><剧情走向>...</剧情走向>` (three parts, engine tag names).'
