r_format: 'Format: Output must be valid JSON only, with no extra commentary, explanation, or greetings outside the JSON object.'
r_user_display_name_tool: 'User nameplate: if the user scenario or system rules explicitly state the user''s name, call-sign, or preferred form of address, call set_user_display_name(name=...) before the first visible dialog line. Do not infer a name.'
r_cname: 'character_name: Must be one of: {names} or other in-story names, or the fixed tokens: {cot_part}{fixed_roles}{opt_scene}{opt_bgm}{opt_cg} (legacy CJK names for the same roles are also accepted at runtime).'
r_sprite: 'Sprites: The sprite field must be a two-digit id (e.g. 01, 02) chosen to match tone and emotion of the line.'
r_full_sprite: 'Sprites: Use the full listed sprite ID as a string (e.g. 01, 02, or 111) to match the line''s tone and emotion. Use -1 when the sprite should stay the same.'
r_vibe: 'Vibe: use brief, specific words describing the character''s current expression and action, or a scene''s or track''s mood and atmosphere. Do not use asset ids.'
