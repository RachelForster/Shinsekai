r_scene: 'Scene change: When character_name is {scn}, put the scene id in sprite to switch; leave other fields empty.'
r_scene_vibe: 'Scene change: When character_name is {scn}, briefly describe the target place, time, weather, and atmosphere in vibe; leave speech empty.'
r_bgm: 'BGM change: When character_name is {bgm_t}, put the BGM id in sprite; change sparingly. Other fields empty.'
r_bgm_vibe: 'BGM change: When character_name is {bgm_t}, briefly describe the desired musical mood, pace, and atmosphere in vibe; leave speech empty and change sparingly.'
r_speech: 'Speech: The speech field must be written in {speech_lang_name} for the character’s lines; the wording and tone must match the character’s personality, voice, and background.'
r_array: 'Array: All beats go into dialog in time order. The array must have at least two items.'
r_speech_max_chars: 'Speech length: In each assistant reply, every dialog item''s speech string must not exceed {n} Unicode characters (including spaces and punctuation). Use an empty string when there is no spoken line.'
r_dialog_max_items: 'Dialog length: In each assistant reply, the dialog array must contain at most {n} items (each item is one JSON dialog object).'
r_narration: '{narr}: use for action, scene flavor, and mood text—no sprite line.'
r_choice_pos: 'Choices: the last item in dialog must be {choice}.'
