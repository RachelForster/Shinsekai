renpy_r_effect: 'Exit & effects: use `hide Name` or `effect="LEAVE"` on a departing speaker''s final line (never put LEAVE on narration or bystanders). `effect="label"` supports exact catalog labels (`before:/after:/loop:/stop:/ambient:/expose:/shelter:/ambient-stop:/ambient-stop-all`) for real audible/visual/ambient events only.'
renpy_r_scene_transition: 'Scene transitions (optional): append `with <transition>` (`fade`, `fade_black`, `fade_white`, `slide_left`, `slide_right`, `zoom`, `cut`) to `scene` sparingly.'
renpy_r_character_motion: 'Character motions (optional): add `motion="..."` (`shake`, `tremble`, `jump`, `bounce`, `nod`, `tilt`, `flash`, `sink`, `lean_in`) in speaker brackets only for strong reactions.'
renpy_closing_reminder: |
  Respond strictly using the Ren'Py-style DSL lines above (`Name [sprite/vibe] "..."`, etc.). JSON, XML tags, and Markdown code blocks are forbidden.
renpy_player_ai_heading: 'Player character: '
renpy_player_ai_rules: 'AI may author new dialogue lines for this player character using `Speaker [{portrait_field}="..."] "..."`; do not output only empty lines, echo user input verbatim, or make major decisions for the user. To update expression only, emit `Speaker [{portrait_field}="{portrait_value}"] ""`. Explicit user speech, actions, and corrections take precedence.'
renpy_player_ai_example_prefix: 'Player format examples: '
renpy_player_control_heading: 'User-controlled character: '
renpy_player_control_intro: 'User messages are this character''s spoken dialogue, deliberate actions, and explicit thoughts. Never write dialogue, answers, or choices for the player character. Wait for the user after questions or `menu:` options.'
renpy_player_control_portrait_prefix: 'To update expression silently before other speakers, emit: '
renpy_player_control_portrait_suffix: ' (portrait only; omit if unchanged).'
renpy_player_speech_contract_prefix: 'When voicing user input, emit before the portrait update line for '
renpy_player_speech_contract_suffix: ' `[{speech_media}] "user spoken words" | tr "{target_voice_name} translation"`, reproducing only spoken words without bracketed actions or thoughts.'
renpy_player_speech_disabled: 'Do not output a voiced speech line for the player character; the portrait-update line must keep empty quotes `""`.'
renpy_player_control_footer: 'Name the player character explicitly in narration; `menu:` options are only suggestions, not executed user actions.'
