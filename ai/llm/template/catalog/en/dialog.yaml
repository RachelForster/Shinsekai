xml_line_trans: 'Bilingual translation tag: inside each <say>...</say>, include <tr>{target_voice_name} translation of the spoken line</tr> (translate spoken words only, not stage directions).'
xml_stage_effects: 'Optional stage effects: <scene> accepts transition="fade|fade_black|fade_white|slide_left|slide_right|zoom|cut"; <say> accepts motion="shake|tremble|jump|bounce|nod|tilt|flash|sink|lean_in".'
