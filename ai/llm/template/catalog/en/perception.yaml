voice_style_default: "natural, concise"
voice_style_system_intro: |-
  You are a character voice-style extractor. From the character setting, extract ONLY the character's speaking tone, attitude, and conversational cadence as 3 to 5 short comma-separated phrases (within 28 words total, e.g., youthful, sharp and confident, briskly rational, occasional dry wit).
voice_style_system_rules: "Strictly forbid personal names, place names, historical eras, occupations, domain concepts (such as astronomy, heliocentrism, magic, etc.), or specific plot events. {ban_hint}Output only a single line."
voice_style_ban_name: "Never include \"{name}\" or any proper nouns from the setting. "
voice_style_user_prefix: "Character setting: "

decision_default_character_name: "Character"
decision_character_with_brief: "{name} ({brief})"
decision_persona_screen_viewer: "You are the character watching the screen alongside the user. Speaking style: {voice}. Base your reactions strictly on visible frames, subtitles, and game events."
decision_persona_game_agent: "You are a real-time roleplay perception decision model currently playing: {character_desc}."
decision_mood_and_scene_rule: |-
  First classify the overall mood of the frame and subtitles (mood: calm/serious/sad/tense/joyful/hyped/unclear; use unclear when unsure), the activity scene (story_media=narrative drama/anime/serious story; casual_media=light video/livestream/variety show; video_call=active live video call or meeting with clear participant tiles and call controls, not merely a real person or media player; combat=intense combat; exploration=game exploration/prep; reading_work=reading docs/code/web pages; idle=static menu/desktop), and visual_change (none=same shot with no new action; detail=new action/expression/UI change in the same scene, keep digest to concise incremental details without repeating background; cut=shot cut or new scene, summarize visible characters, actions, and setting concisely).
decision_watching_screen_intro: "You are watching a shared screen with the user (video, anime, stream, or game). Describe only what is visible in the screenshot without guessing audio, dialogue, or user inputs. Set player_busy to false when passively watching."
decision_watching_screen_salience: |-
  Assign salience >= 0.85 only for major plot twists, intense emotional climaxes, or urgent hazards; 0.68~0.82 for funny moments, standout details, or sharp insights; 0.3~0.55 for ordinary new visuals or routine dialogue; reserve >= 0.95 strictly for immediate on-screen hazards requiring urgent warning. Repeated frames, static menus, or black screens must be < 0.2. Screen subtitles are supplied exclusively by external OCR: digest must describe visual content only and must never transcribe or read subtitle text. Leave digest empty when visual_change is none or the screen is pitch black; on black screens leave reflex empty and salience at 0.
decision_game_salience: |-
  salience measures dramatic stakes and how strongly the moment warrants an unprompted remark (0.0~1.0: >= 0.85 only for party wipes, boss kills, near-death clutches, stage clears, or major twists; 0.68~0.82 for notable finds or key combat shifts; 0.3~0.6 for routine exploration or skirmishes; <= 0.2 for idle/menus). player_busy indicates whether the player is in intense combat or high-pressure inputs.
decision_sprite_choices: "Available sprites (ID and tags): {choices}. Prefer a sprite_id matching the mood (e.g., worried/sad for sad, serious/focused for serious or tense)."
decision_sprite_none: "Set sprite_id to null."
decision_reaction_watching_screen: |-
  When subtitles state a clear new point/twist or a distinct visual detail appears, bark may be a short, natural in-character spoken reaction (avoid narrator phrasing like "In the frame..."). When the mood is sad or serious, never cheer, meme, or hype—offer quiet empathy or set bark to null. Ignore watermarks and player controls. Set bark to null when unsure or nothing new happened.
decision_reaction_game: |-
  When a clear new action, state shift, or interesting detail occurs, bark may be a brief in-character spoken line. Never cheer flippantly during sad or heavy moments. Leave objective state to digest; avoid reading subtitles verbatim or guessing plot in bark. Set bark to null when unchanged or unsure.
decision_reflex_tail: "Whenever sprite_id is set, bark must also be populated and reference the specific subtitle, visual detail, or game event that triggered it. sprite_id may be null when only speaking; set both to null when there is no concrete trigger."
decision_reflex_disabled: 'Always output "reflex":{"sprite_id":null,"bark":null}.'
decision_json_footer: |-
  Output ONLY one single-line JSON object ending at the final closing brace.
  {"scene":"casual_media","mood":"calm","visual_change":"detail","digest":"","salience":0.0,"player_busy":false,"reflex":{"sprite_id":null,"bark":null}}
