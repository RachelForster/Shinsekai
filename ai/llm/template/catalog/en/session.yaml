dialog_repair_initial: Reformat your immediately preceding answer as the application's dialogue JSON. Return only a JSON object with a non-empty `dialog` array. Each character, scene, and BGM item must have `character_name`, `speech`, and `{media_field}`. Fixed system items such as COT, NARR, CHOICE, STAT, and CG may omit the media field. Do not call tools or add markdown.
dialog_repair_retry: That reply is STILL not valid. You MUST answer with ONLY the application's dialogue JSON. Return only a JSON object with a non-empty `dialog` array. Each character, scene, and BGM item must have `character_name`, `speech`, and `{media_field}`. Fixed system items such as COT, NARR, CHOICE, STAT, and CG may omit the media field. Do not call tools or add markdown.
memory_context_simple_guidance: Relevant long-term memories for this turn. Use them only as background; do not mention the retrieval process unless the user asks.
memory_context_tiered_guidance: Relevant long-term memories for this turn. Respect each item's clarity tag ([Canon], [Clear], [Faded impression], [Awakened distant memory]); use them naturally as background and never mention the retrieval system unless asked.
memory_tier_canon: Canon
memory_tier_clear: Clear
memory_tier_faded: Faded impression
memory_tier_dormant: Awakened distant memory
