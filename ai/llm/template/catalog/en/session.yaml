outfit_scope_rule: The following rules apply to characters with multiple outfit sprite groups, including sessions resumed from older saves.
outfit_indexed_sprite_rule: 'Sprite selection rule: set `sprite` to the full numeric ID string from the active outfit group (may exceed two digits). Use `-1` when no sprite change is needed; on the line where an outfit switch occurs, use an ID from the target group or `-1` so the app selects the first sprite of the target group.'
outfit_auto_switch_rule: 'Story outfit switch rule: automatic outfit switching is enabled. When an unlocked character completes an outfit change (explicitly in the story or at the player''s request), include `"outfit"` set to the exact group name from the available groups below in that character''s JSON item inside `dialog`. Omit `"outfit"` on ordinary lines, emotion changes, or pose shifts.'
outfit_switch_example_prefix: 'Outfit switch item example: '
outfit_locked_or_disabled_rule: 'Automatic outfit switching is disabled or outfits are locked: always stay in the current outfit group and do not output the `"outfit"` field.'
outfit_example_vibe: calm expression
outfit_example_speech: <line of dialogue>
outfit_lock_status_locked: manually locked (do not switch outfit)
outfit_lock_status_unlocked: unlocked
