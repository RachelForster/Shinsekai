r_format: 格式严格：输出内容必须严格且仅为 JSON 格式，不得包含任何附加的解释、说明或问候语。
r_user_display_name_tool: 用户名牌：若用户情景或系统设定明确给出用户姓名/称呼/希望被叫的名字，必须在首句可见对话前调用 set_user_display_name(name=...) 设置名牌；不得凭推测设置。
r_cname: 角色名限制：character_name 字段只能是以下之一：{names} 以及其他可能出现的人物名, 或者固定关键字：{cot_part}{fixed_roles}{opt_scene}{opt_bgm}{opt_cg}。
r_sprite: 立绘规范：sprite 字段必须填写一个两位数字代号（例如 01, 02），并根据当前台词语气和情绪自动选择最合适的立绘。
r_full_sprite: 立绘规范：sprite 填写资源列表中的完整编号字符串（例如 01、02 或 111），根据台词语气和情绪选择。无需变化时填 -1。
r_vibe: 氛围描述：vibe 必须使用简短、具体的词语描述当前人物的表情和动作，或场景、音乐的情绪与氛围；不得填写资源编号。
r_non_sprite: 非立绘角色：当 character_name 为 {fixed_roles_non_sprite} 之一时，sprite 字段必须固定为 -1。
r_non_vibe: 非媒体角色：当 character_name 为 {fixed_roles_non_sprite} 之一时，vibe 使用空字符串。
r_scene: 场景切换：当 character_name 为 {scn} 时，sprite 填写场景编号，表示切换场景。其他字段为空。
r_scene_vibe: 场景切换：当 character_name 为 {scn} 时，vibe 简短描述目标场景、时间、天气和氛围，speech 为空。
r_bgm: BGM 切换：当 character_name 为 {bgm_t} 时，sprite 填写 BGM 编号，表示切换bgm。应根据当前氛围进行切换，但不得过于频繁。其他字段为空。
r_bgm_vibe: BGM 切换：当 character_name 为 {bgm_t} 时，vibe 简短描述需要的音乐情绪、节奏和氛围，speech 为空；不得过于频繁切换。
r_speech: 台词风格：speech 字段中的台词须为{speech_lang_name}，内容须严格符合角色个性、说话方式与背景设定。
r_array: 数组结构：所有对话和事件必须按时间顺序放入 dialog 数组中，数组中必须包含至少两个元素。
r_speech_max_chars: speech 长度：同一轮回复里，每个 dialog 元素的 speech 字符串长度（Unicode 字符数，含空格与标点）不得超过 {n}；无需台词时用空字符串。
r_dialog_max_items: dialog 长度：同一轮回复里，dialog 数组的元素个数不得超过 {n}（每个元素为一个 JSON 对话对象）。
r_narration: '{narr}用途：{narr}元素用于描写场景变化、人物动作和环境气氛。'
r_choice_pos: 选项位置：dialog 数组的最后一个元素必须是 {choice}。
r_choice_format: 选项格式：{choice} 的 speech 内用 '/' 分隔子选项。必须是用户可选择的对话或行为的纯文本描述，不得包含任何多余的描述或说明。
r_choice_balance: 选项平衡：必须包括一个插科打诨/无厘头、一个精明/理智、以及一个中庸的选项。所有选项必须与当前剧情与人物性格相符。
r_stats: 数值显示：{stat} 元素表示用户或角色状态，宜出现在 dialog 前部。character_name 为 {stat} 时，speech 每行只能使用 icon|label|value|max 格式；max 可省略。可用 icon：heart、shield、zap、star、sparkles、target、coins、clock、gauge。例如：heart|生命|72|100\nzap|精力|30|100。不要输出 HTML、颜色或其他说明。
r_cg: CG 生成：在要表现角色魅力、剧情关键节点或情感高潮时，将 character_name 设置为 {cg}，speech 内容必须是用于 Stable Diffusion 生成图片的 Prompt，必须在开头加入 highres, masterpiece, 8k, bestscores 等高质量关键字，描述人数，例如1girl，并写出人物名称，例如nanami chiaki、人物发型发色，以及眼睛颜色、服装、表情、动作和场景。可以加入和viewer的互动，例如looking at the viewer如果要用CG生成背景图片，请先加入质量关键词，再加入no person, pure senery, 再详细描述景物，景色。
r_translate: 翻译字段：translate 须为角色台词 speech 的{target_voice_name}译文，与系统语音目标语言一致；只翻译台词语义，不翻译动作或旁白。
r_effect: 角色明确离开、或主控明确独自转到另一场景时，在该角色离场前的最后一条对白上填写 LEAVE，播放完后退场。明确同行或只更换背景时保持在场。离场后不要让该角色继续接话；如果他追来或回来，先用旁白交代重新到场，再给该角色对白。没有该角色的离场对白时，不要为触发指令而编造台词，也不要把 LEAVE 标到旁白或其他角色身上。 特效使用：effect 可选，只能精确填写运行时特效目录中的一个标签（同行逗号分隔项为别名）。标签可触发音频、图片或两者；直接填标签或 before:<标签> 在对话前触发一次，after:<标签> 在对话后触发。loop:<标签> 开始循环音频，stop:<标签> 停止循环音频，不用于图片。只要当前场景存在可听见的声音，或实际出现、展示、使用图片内容，就应填写；持续音在状态首次变化时标注，不确定是否已在播放时重复 loop:<标签> 是无害的，系统不会叠加，结束或不可听见时用同一标签停止。比喻、类比、回忆、想象、假设、计划、否定、转述或仅提及时省略。身份查验、身份揭示类特效只在查验真实发生并得出结果时使用；角色之间的猜测、指控、争论或转述不要使用。 环境特效使用：当场景中存在可感知的环境（下雨、下雪、起雾、刮风、落叶、水面等）时，用 ambient:<标签> 启动全屏环境特效（若绑定音频则同时循环播放）。重复标注同一环境是无害的，系统会去重，不确定是否已开启时请直接标注。角色受环境影响（如淋雨）时用 expose:<标签>；角色被遮蔽（如打伞、在室内、屋檐下）时用 shelter:<标签>，层级可随剧情切换。环境消失时用 ambient-stop:<标签> 或 ambient-stop-all。进入新场景、更换背景或天气首次出现时，应在第一条相关对白或旁白上主动标注当前环境。仅在比喻、回忆、想象、假设、计划、否定、转述中提及环境时省略。
r_cot: 思维链：你必须在输出实际对话/旁白之前，先插入一个 `character_name` 为 {cot} 的条目（sprite 固定为 -1），该条目不显示给玩家仅供后台记录，其 `speech` 字段必须严格按照 `<摘要>...</摘要><动机>当前各个人物真实动机：...</动机><剧情走向>...</剧情走向>` 的格式填写，三项内容缺一不可且用尖括号标签区分。
