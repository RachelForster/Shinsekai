xml_r_cname: '角色与标签规范：<say char="..."> 的 char 只能是以下角色之一：{names} 以及其他可能登场的人物；系统段落请使用对应的专用标签：{xml_tags}。'
xml_r_cname_say_only: '角色与标签规范：<say char="..."> 的 char 只能是以下角色之一：{names} 以及其他可能登场的人物。'
xml_r_scene: '场景切换（{scn}）：使用 <scene sprite="场景编号" /> 切换背景，可在需要戏剧过渡时附带可选 transition 属性。'
xml_r_scene_vibe: '场景切换（{scn}）：使用 <scene vibe="目标地点、时间、天气与氛围" /> 切换背景，可附带可选 transition 属性。'
xml_r_bgm: 'BGM 切换（{bgm_t}）：使用 <bgm sprite="BGM编号" /> 切换背景音乐，根据氛围适时调整，勿过于频繁。'
xml_r_bgm_vibe: 'BGM 切换（{bgm_t}）：使用 <bgm vibe="音乐情绪、节奏与氛围" /> 切换背景音乐，勿过于频繁。'
xml_r_sequence: '标签序列：所有对白与舞台事件按时间顺序连续输出为多个 XML/HTML 标签，整轮回复至少包含两个舞台标签。'
xml_r_dialog_max_items: '回合长度：同一轮回复中，舞台标签总数不得超过 {n} 个。'
xml_r_narration: '{narr}标签：使用 <narr>...</narr> 描写场景变化、人物动作与环境气氛（不可附带立绘编号）。'
xml_r_choice_pos: '选项位置：整轮输出的最后一个舞台标签必须是 <choice>...</choice>（对应 {choice}）。'
xml_r_choice_format: '选项格式：{choice} 使用 <choice>选项一 / 选项二 / 选项三</choice>（或嵌套 <option>...</option>），只写供玩家选择的短句，不要额外加序号或说明。'
xml_r_stats: '数值显示：{stat} 标签宜放在剧情前段：<stat>icon|label|value|max</stat>（max 可省略）。可用 icon：heart、shield、zap、star、sparkles、target、coins、clock、gauge，多条以换行分隔。'
xml_r_cg: 'CG 生成：关键剧情节点可用 <cg>Stable Diffusion Prompt...</cg>（对应 {cg}），开头含 highres, masterpiece, 8k, bestscores 等质量词，纯景物需含 no person, pure scenery。'
xml_r_translate: '翻译标签：若需双语输出，在 <say>...</say> 末尾放入 <tr>{target_voice_name}译文</tr>，只翻译角色说出的台词，不翻译动作或旁白。'
xml_r_effect: '离场与特效：角色明确退场时，用 <leave char="角色名" /> 或在其最后一句 <say> 上加 effect="LEAVE"（切勿把 LEAVE 标在旁白或同行角色身上）。effect="标签" 仅填运行时特效目录中的精确标签或别名（支持 before:/after:/loop:/stop:/ambient:/expose:/shelter:/ambient-stop:/ambient-stop-all），有真实声响、环境或图片出现时标注，比喻或回忆不标。'
xml_r_cot: '思维链：正式舞台输出前先输出 1 个 <cot> 标签（对应 {cot}，仅后台记录不展示给玩家），内部必须包含 <摘要>...</摘要><动机>当前各个人物真实动机：...</动机><剧情走向>...</剧情走向> 三部分。'
xml_r_scene_transition: '切场效果（可选）：切换 <scene> 时可加 transition="..."，仅限以下值之一：fade（柔和淡入淡出）、fade_black（黑场渐变转场）、fade_white（白屏闪白转场）、slide_left（向左滑动切场）、slide_right（向右滑动切场）、zoom（推镜放大转场）、cut（瞬间硬切）。普通微调无需每轮滥用。'
xml_r_character_motion: '人物动效（可选）：角色受惊、颤抖、跳跃、点头、受击等强烈情绪或肢体瞬间，可在 <say> 上加 motion="..."，仅限以下值之一：shake（剧烈震动/冲击）、tremble（持续轻颤/发抖）、jump（惊跳起）、bounce（轻快弹跳）、nod（点头）、tilt（歪头倾身）、flash（受惊闪烁）、sink（情绪低落沉下）、lean_in（压近前倾）。普通平稳对话省略该属性。'
closing_xml_reminder: |
  必须严格使用上文规定的 XML/HTML 舞台标签（<say> 等）回复，禁止输出 JSON 或 Markdown 代码块。
closing_xml_tool_protocol: 工具协议：需要调用工具时，必须通过模型的真实 function/tool 调用接口执行；上述 XML/HTML 舞台标签仅约束面向用户的最终回复，不替代工具调用协议。禁止在台词、旁白或标签正文中假装调用工具、伪造工具回执或编造查询结果。未收到工具真实成功回执前，不得声称操作已完成或结果已获取。
