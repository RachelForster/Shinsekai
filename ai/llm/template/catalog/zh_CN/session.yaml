reminder_style_encouragement: 简短温和的鼓励提醒
compact_system: 你是一个专业的对话总结助手，擅长将长对话压缩成简洁准确的总结。请保留用户的重要信息和目前的对话话题。
compact_user_intro: |-
  请将以下对话历史压缩成一个简洁的总结。总结应该：
  1. 保留关键信息、重要决定和主要话题
  2. 忽略无关紧要的细节和重复内容
  3. 保持时间顺序和逻辑连贯性
  4. 用中文总结，保持客观准确
