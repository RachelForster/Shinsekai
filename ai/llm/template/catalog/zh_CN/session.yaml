dialog_repair_initial: 请将你上一条回复重新整理为符合应用要求的对话 JSON。只返回一个包含非空 `dialog` 数组的 JSON 对象。每个角色、场景与 BGM 条目都必须包含 `character_name`、`speech` 和 `{media_field}`。COT、NARR、CHOICE、STAT、CG 等固定系统条目可省略媒体字段。不要调用工具，也不要输出 Markdown。
dialog_repair_retry: 该回复仍然不符合有效格式。你必须仅以符合应用要求的对话 JSON 作答。只返回一个包含非空 `dialog` 数组的 JSON 对象。每个角色、场景与 BGM 条目都必须包含 `character_name`、`speech` 和 `{media_field}`。COT、NARR、CHOICE、STAT、CG 等固定系统条目可省略媒体字段。不要调用工具，也不要输出 Markdown。
dialog_repair_initial_selective: 请将你上一条回复重新整理为符合应用要求的对话 JSON。只返回一个包含非空 `dialog` 数组的 JSON 对象。所有条目都必须包含 `character_name` 和 `speech`；仅场景（SCENE）、BGM（bgm）以及已绑定演员表角色必须包含非空 `{media_field}`。COT、NARR、CHOICE、STAT、CG 与未绑定的龙套/NPC 发言可省略 `{media_field}`。不要调用工具，也不要输出 Markdown。
