# The functions below normalize untrusted path text, enforce containment within
# an explicit trusted root, and only then return a pathlib.Path (or a single
# filename component). Model every supported import surface so CodeQL preserves
# that security boundary across function calls.
extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: barrierModel
    data:
      - ["sdk.path_utils", "Member[safe_project_path].ReturnValue", "path-injection"]
      - ["sdk.path_utils", "Member[safe_child_path].ReturnValue", "path-injection"]
      - ["sdk.path_utils", "Member[safe_existing_path].ReturnValue", "path-injection"]
      - ["sdk.path_utils", "Member[safe_existing_file_path].ReturnValue", "path-injection"]
      - ["sdk.path_utils", "Member[safe_existing_dir_path].ReturnValue", "path-injection"]
      - ["sdk.path_utils", "Member[safe_filename].ReturnValue", "path-injection"]
      - ["core.security.paths", "Member[safe_project_path].ReturnValue", "path-injection"]
      - ["core.security.paths", "Member[safe_child_path].ReturnValue", "path-injection"]
      - ["core.security", "Member[safe_project_path].ReturnValue", "path-injection"]
      - ["core.security", "Member[safe_child_path].ReturnValue", "path-injection"]
      - ["frontend_bridge_core.security", "Member[safe_project_path].ReturnValue", "path-injection"]
      - ["frontend_bridge_core.security", "Member[safe_child_path].ReturnValue", "path-injection"]
      - ["frontend_bridge_core.security", "Member[safe_existing_path].ReturnValue", "path-injection"]
      - ["frontend_bridge_core.security", "Member[safe_existing_file_path].ReturnValue", "path-injection"]
      - ["frontend_bridge_core.security", "Member[safe_existing_dir_path].ReturnValue", "path-injection"]
      - ["frontend_bridge_core.security", "Member[safe_filename].ReturnValue", "path-injection"]
