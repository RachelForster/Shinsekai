nodes:
  - name: llm_worker
    type: application.runtime.workers.LLMWorker
  - name: dialog_media_worker
    type: application.runtime.workers.DialogMediaWorker
  - name: presentation_worker
    type: application.runtime.workers.PresentationWorker
edges:
  - src: llm_worker
    src_port: dialog
    dst: dialog_media_worker
    dst_port: dialog
  - src: dialog_media_worker
    src_port: presentation
    dst: presentation_worker
    dst_port: presentation
exports:
  chat.input:
    node: llm_worker
    port: user_input
    direction: input
  chat.dialog_input:
    node: dialog_media_worker
    port: dialog
    direction: input
  chat.presentation_input:
    node: presentation_worker
    port: presentation
    direction: input
  chat.ui_worker:
    node: presentation_worker
    direction: node
  chat.dialog_media_worker:
    node: dialog_media_worker
    direction: node
